[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "musicagent"
version = "0.1.0"
description = "Multi-agent music creation tooling for structured song and MIDI generation."
requires-python = ">=3.12,<3.14"
dependencies = [
    "crewai",
    "fastapi",
    "langchain-openai",
    "mido",
    "music21",
    "pretty_midi",
    "pydantic",
    "python-dotenv",
    "python-multipart",
    "rich",
    "typer",
    "uvicorn",
]

[project.scripts]
musicagent = "musicagent.cli:main"

[tool.setuptools.packages.find]
include = ["musicagent*"]
exclude = ["tests*", "typings*", "outputs*"]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "ruff",
]

[tool.ruff]
line-length = 100
src = ["musicagent", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["musicagent"]
mypy_path = "typings"
